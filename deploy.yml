<!-- THIS IS NOT FOR USE. The workflow eventually become part of the custom deployment. 
When ready, I'll use this in GitHub Actions as my own deployment flow.-->

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uprawnienia potrzebne do deployu na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapobiega równoległym deployom gdy kilka pushów idzie szybko po sobie
concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # -------------------------------------------------------
  # JOB 1: Sprawdza jakość plików przed mergem i deployem
  # -------------------------------------------------------
  lint-and-check:
    name: Lint and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sprawdza zerwane linki w plikach HTML
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.html'
          fail: true

  # -------------------------------------------------------
  # JOB 2: Deploy – odpala się TYLKO przy pushu do main
  # -------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: lint-and-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
